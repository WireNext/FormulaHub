<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ F1 Hub | Campeonato y Calendario Desplegable</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/f1_icon.png" type="image/png">
</head>
<body>
    <header>
        <h1>F1 Hub | Control de Campeonato</h1>
        <p>BETA</p>
    </header>

    <main class="container">
        
        <details open class="f1-card">
            <summary><h2>🗓️ Calendario de Carreras</h2></summary>
            <div class="details-content">
                <div id="calendario-list">
                    </div>
            </div>
        </details>

        <hr>

        <details class="f1-card">
            <summary><h2>🏆 Campeonato de Pilotos</h2></summary>
            <div class="details-content">
                <table id="pilotos-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Foto</th>
                            <th>Piloto</th>
                            <th>Equipo</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </details>

        <hr>

        <details class="f1-card">
            <summary><h2>⚙️ Campeonato de Constructores</h2></summary>
            <div class="details-content">
                <table id="constructores-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Logo</th>
                            <th>Equipo</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </details>
    </main>

    <footer>
        <p>BETA</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
