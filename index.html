<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ F1 Hub | Campeonato y Calendario</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/f1_icon.png" type="image/png">
</head>
<body>
    <header>
        <h1>F1 Hub | Control de Campeonato</h1>
    </header>

    <main class="container">
        
        <section class="section calendar-section">
            <h2>🗓️ Calendario de Carreras</h2>
            <div id="calendario-list">
                </div>
        </section>

        <hr>

        <section class="section standings-section">
            <h2>🏆 Campeonato de Pilotos</h2>
            <table id="pilotos-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Foto</th>
                        <th>Piloto</th>
                        <th>Equipo</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>

        <hr>

        <section class="section standings-section">
            <h2>⚙️ Campeonato de Constructores</h2>
            <table id="constructores-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Logo</th>
                        <th>Equipo</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>BETA</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
